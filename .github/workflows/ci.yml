name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
        env:
          TZ: America/Bogota   # zona con offset negativo: detecta errores de fechas UTC
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pethealth:ci .
      - name: Smoke test
        run: |
          docker run -d --name ph -p 3001:3001 -e JWT_SECRET=ci pethealth:ci
          for i in $(seq 1 30); do curl -sf localhost:3001/api/auth/config && break; sleep 1; done
          curl -sf localhost:3001/ | grep -q '<div id="root">'
          docker logs ph
