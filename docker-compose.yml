version: '3.8'

services:
  backend:
    build: ./backend
    container_name: pethealth-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - JWT_SECRET=cambiar_esto_en_produccion_por_una_clave_segura
      - NODE_ENV=production
      - PORT=3001
    networks:
      - pethealth-net

  frontend:
    build: ./frontend
    container_name: pethealth-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pethealth-net

networks:
  pethealth-net:
    driver: bridge
